# ── Rate limiting (OWASP A04) — на уровне http, вне server ────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Security Headers (OWASP A05) ─────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"             always;
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-XSS-Protection          "1; mode=block"          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:;"
        always;

    # ── API proxy → backend ───────────────────────────────────────────────────
    location /auth/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://app:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /admin/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://app:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /reports   { proxy_pass http://app:8000/reports;   proxy_set_header Host $host; }
    location /documents { proxy_pass http://app:8000/documents; proxy_set_header Host $host; }
    location /settings  { proxy_pass http://app:8000/settings;  proxy_set_header Host $host; }
    location /avatars/  { proxy_pass http://app:8000/avatars/;  proxy_set_header Host $host; }
    location /health    { proxy_pass http://app:8000/health;    proxy_read_timeout 5s; }
    location /docs      { proxy_pass http://app:8000/docs;      proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://app:8000/openapi.json; }

    # WebSocket proxy
    location /ws/ {
        proxy_pass          http://app:8000/ws/;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
    }

    # ── React SPA ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static assets cache ───────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires      1y;
        add_header   Cache-Control "public, immutable";
        try_files    $uri =404;
        access_log   off;
    }

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml text/javascript;
    gzip_min_length 1000;
    gzip_vary       on;

    # ── Hide Nginx version ────────────────────────────────────────────────────
    server_tokens off;
}
